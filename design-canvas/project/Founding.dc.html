<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Found a nation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E8A33D}a:hover{color:#F4C374}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #E8A33D;outline-offset:2px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #0E1217; color: #ECE9E2; font-family: 'IBM Plex Sans', system-ui, sans-serif; overflow: hidden">

  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 40px 56px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="26" height="28" viewBox="0 0 26 28" aria-hidden="true"><path d="M13 1 L25 7.5 V20.5 L13 27 L1 20.5 V7.5 Z" fill="none" stroke="#E8A33D" stroke-width="2"></path><path d="M13 8 L19 11.5 V17 L13 20.5 L7 17 V11.5 Z" fill="#E8A33D"></path></svg>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.08em">POLITICAL EMPIRE</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 40px; line-height: 1.05">Found your nation</h1>
      <p style="margin: 0; color: #9AA4B1; font-size: 16px">Your answers set where it starts. Every later decision moves it.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="nation-name" style="font-size: 13px; font-weight: 600">Name of the nation</label>
        <input id="nation-name" type="text" value="{{name}}" onChange="{{setName}}" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #3A4452; background: #161C24; color: #ECE9E2; font-family: inherit; font-size: 16px">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="nation-motto" style="font-size: 13px; font-weight: 600">Motto</label>
        <input id="nation-motto" type="text" value="{{motto}}" onChange="{{setMotto}}" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #3A4452; background: #161C24; color: #ECE9E2; font-family: inherit; font-size: 16px">
      </div>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 14px">
      <legend style="padding: 0; margin-bottom: 14px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px">Founding principles</legend>
      <sc-for list="{{questions}}" as="q" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 20px">
          <span style="width: 240px; flex: none; font-size: 15px">{{q.prompt}}</span>
          <div role="group" aria-label="{{q.prompt}}" style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{q.options}}" as="o" hint-placeholder-count="3">
              <button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="height: 44px; border-radius: 8px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: #ECE9E2; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{o.label}}</button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column">
      <legend style="padding: 0; margin-bottom: 14px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px">Starting land</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{lands}}" as="l" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{l.on}}" onClick="{{l.pick}}" style="text-align: left; padding: 14px 16px; border-radius: 8px; border: 1px solid {{l.border}}; background: {{l.bg}}; color: #ECE9E2; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px">
            <span style="font-weight: 600; font-size: 15px">{{l.name}}</span>
            <span style="font-size: 13px; color: #9AA4B1">{{l.desc}}</span>
          </button>
        </sc-for>
      </div>
    </fieldset>
  </main>

  <aside aria-label="Preview" style="width: 460px; box-sizing: border-box; padding: 40px; background: #161C24; border-left: 1px solid #2C3642; display: flex; flex-direction: column; gap: 24px">
    <span style="color: #9AA4B1; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase">Preview</span>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div aria-hidden="true" style="width: 180px; height: 120px; border-radius: 4px; overflow: hidden; border: 1px solid #3A4452; position: relative">
        <sc-if value="{{flag.tri}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; width: 100%; height: 100%"><span style="flex: 1; background: {{flag.a}}"></span><span style="flex: 1; background: #ECE9E2"></span><span style="flex: 1; background: {{flag.b}}"></span></div>
        </sc-if>
        <sc-if value="{{flag.bands}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; width: 100%; height: 100%"><span style="flex: 2; background: {{flag.a}}"></span><span style="flex: 1; background: {{flag.b}}"></span><span style="flex: 2; background: {{flag.a}}"></span></div>
        </sc-if>
        <sc-if value="{{flag.canton}}" hint-placeholder-val="{{false}}">
          <div style="width: 100%; height: 100%; background: {{flag.a}}"><span style="position: absolute; left: 0; top: 0; width: 45%; height: 55%; background: {{flag.b}}"></span></div>
        </sc-if>
      </div>
      <div style="display: flex; gap: 8px" role="group" aria-label="Flag pattern">
        <sc-for list="{{patterns}}" as="p" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: #ECE9E2; font-family: inherit; font-size: 13px; cursor: pointer">{{p.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; gap: 8px" role="group" aria-label="Flag colour">
        <sc-for list="{{palettes}}" as="c" hint-placeholder-count="4">
          <button type="button" aria-label="{{c.label}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="width: 44px; height: 44px; padding: 0; border-radius: 8px; border: 2px solid {{c.border}}; background: #1E2630; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 2px">
            <span style="width: 13px; height: 24px; border-radius: 2px; background: {{c.a}}"></span><span style="width: 13px; height: 24px; border-radius: 2px; background: {{c.b}}"></span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.1">{{displayName}}</h2>
      <p style="margin: 0; color: #9AA4B1; font-size: 15px">“{{motto}}” · {{landName}}</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <sc-for list="{{axes}}" as="a" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; font-size: 12px; color: #9AA4B1"><span>{{a.left}}</span><span>{{a.right}}</span></div>
          <div role="img" aria-label="{{a.aria}}" style="position: relative; height: 8px; border-radius: 4px; background: #1E2630">
            <span style="position: absolute; left: {{a.v}}%; top: -4px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #E8A33D; border: 3px solid #161C24; box-sizing: border-box"></span>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="flex: 1"></div>
    <a href="Main.dc.html" style="height: 52px; border-radius: 8px; background: #E8A33D; color: #0E1217; text-decoration: none; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.04em">Found the nation</a>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: 'Republic of Veyra', motto: 'By the harbour and the vote.', answers: [2, 1, 1, 2], land: 0, pattern: 0, palette: 0 };
  }
  renderVals() {
    const s = this.state;
    const on = (x) => ({ border: x ? '#E8A33D' : '#2C3642', bg: x ? '#2A2418' : '#1E2630', on: x });
    const qs = [
      { prompt: 'Who should hold power?', left: 'Authority', right: 'Liberty', opts: ['One strong leader', 'A council of elders', 'The people, by vote'] },
      { prompt: 'Who owns the harvest?', left: 'Collective', right: 'Market', opts: ['The state shares it', 'Guilds and towns', 'Whoever grows it'] },
      { prompt: 'What of the old ways?', left: 'Tradition', right: 'Reform', opts: ['Keep them', 'Adapt them', 'Replace them'] },
      { prompt: 'Strangers at the border?', left: 'Isolation', right: 'Openness', opts: ['Close the gates', 'Trade only', 'Welcome them'] }
    ];
    const questions = qs.map((q, qi) => ({
      prompt: q.prompt,
      options: q.opts.map((label, oi) => ({ label, ...on(s.answers[qi] === oi), pick: () => { const a = s.answers.slice(); a[qi] = oi; this.setState({ answers: a }); } }))
    }));
    const axes = qs.map((q, qi) => { const v = [22, 50, 78][s.answers[qi]]; return { left: q.left, right: q.right, v, aria: q.left + ' to ' + q.right + ': ' + v + ' of 100' }; });
    const landDefs = [
      { name: 'Coast', desc: 'Trade and a navy. Exposed to raids.' },
      { name: 'River valley', desc: 'Grows fast. Crowded neighbours.' },
      { name: 'Highlands', desc: 'Easy to defend. Slow to grow.' }
    ];
    const lands = landDefs.map((l, i) => ({ ...l, ...on(s.land === i), pick: () => this.setState({ land: i }) }));
    const patterns = ['Tricolour', 'Bands', 'Canton'].map((label, i) => ({ label, ...on(s.pattern === i), pick: () => this.setState({ pattern: i }) }));
    const pals = [
      { a: '#E8A33D', b: '#1F3A5F', label: 'Amber and navy' },
      { a: '#3FA7A0', b: '#0E1217', label: 'Teal and black' },
      { a: '#C4607A', b: '#ECE9E2', label: 'Rose and ivory' },
      { a: '#8DB8E8', b: '#5B3A1E', label: 'Sky and umber' }
    ];
    const palettes = pals.map((p, i) => ({ ...p, on: s.palette === i, border: s.palette === i ? '#E8A33D' : '#2C3642', pick: () => this.setState({ palette: i }) }));
    const pal = pals[s.palette];
    return {
      name: s.name, motto: s.motto,
      displayName: s.name.trim() || '[NATION NAME]',
      setName: (e) => this.setState({ name: e.target.value }),
      setMotto: (e) => this.setState({ motto: e.target.value }),
      questions, axes, lands, patterns, palettes,
      landName: landDefs[s.land].name,
      flag: { a: pal.a, b: pal.b, tri: s.pattern === 0, bands: s.pattern === 1, canton: s.pattern === 2 }
    };
  }
}
</script>
</body>
</html>
